name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          mkdir -p proyecto
          for z in *.zip; do unzip -q -o "$z" -d proyecto; done
          find proyecto -maxdepth 3 -name settings.gradle.kts

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar la app
        run: |
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts | head -1)")
          cd "$DIR"
          gradle assembleDebug --stacktrace
          cd "$GITHUB_WORKSPACE"
          echo "APK_PATH=$DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: ALTEA-apk
          path: ${{ env.APK_PATH }}

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ALTEA v${{ github.run_number }}
          files: ${{ env.APK_PATH }}
